name: shaqlah
on:
  push: { paths: ["shaqlah/**", ".github/workflows/shaqlah.yml"] }
  pull_request: { paths: ["shaqlah/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: shaqlah } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shaqlah, POSTGRES_PASSWORD: shaqlah, POSTGRES_DB: shaqlah_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shaqlah" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shaqlah:shaqlah@localhost:5432/shaqlah_test
      DATABASE_URL: postgres://shaqlah:shaqlah@localhost:5432/shaqlah_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: shaqlah/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
